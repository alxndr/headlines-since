name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Elm
        run: npm install -g elm@0.19.1-5

      - name: Build Elm
        run: elm make src/Main.elm --output build/js/elm.js

      - name: Create config
        run: echo "export const CORS_PROXY_KEY='${{ secrets.CORS_PROXY_KEY }}';" > src/JS/config.js

      - name: Assemble build directory
        run: |
          mkdir -p build/js
          cp src/index.html build/
          cp src/styles.css build/
          cp -r src/JS/* build/js/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
