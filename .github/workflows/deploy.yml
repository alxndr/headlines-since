name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.13
        with:
          architecture: 'x64'
          distribution: 'full'
          version: '8.18'

      - name: Install Pollen
        run: raco pkg install --auto pollen

      - name: Build with Pollen
        run: raco pollen render src

      - name: Assemble build directory
        run: |
          mkdir -p build
          cp src/index.html build/index.html 2>/dev/null || true
          cp src/styles.css build/styles.css 2>/dev/null || true
          cp -r src/js build/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4