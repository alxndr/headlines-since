name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets the deploy workflow run these checks first, so a failing check
  # stops the deploy.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
