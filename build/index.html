<html><head><meta charset="UTF-8"/></head><body><root><h1>Headlines Since</h1>

<p>After being away, catch up on the biggest stories since a date you choose.</p>



<form id="hs-form"><label for="start-date">Start date (up to 1 year ago)</label><input type="date" id="start-date" name="start-date" required="required"/><label for="count">Number of stories</label><input type="number" id="count" name="count" min="5" max="20" value="10" required="required"/><button type="submit">Find headlines</button></form>



<div id="hs-status" aria-live="polite"></div>



<div id="hs-results"></div>



<section><p>Biggest individual stories ranked by significance (no forced topic diversification).</p></section>



<script src="js/app.js" type="module"></script></root></body></html>
